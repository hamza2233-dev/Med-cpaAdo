<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med CPA ADO | RTB Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .publisher-badge {
            display: inline-block;
            background: #eff6ff;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #responseArea {
            margin-top: 1.5rem;
            display: none;
        }

        .status-box {
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            position: relative;
            overflow-x: auto;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: monospace;
        }

        .copy-btn {
            background: #fff;
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            float: right;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="publisher-badge">PUB: ADO0048</span>
        <h1>Med CPA ADO</h1>
        <p>Real-Time Bid Checker</p>
    </div>

    <form id="rtbForm">
        <div class="form-group">
            <label>Caller Phone Number</label>
            <input type="text" id="caller_number" placeholder="e.g. +18881234567" required>
        </div>
        <button type="submit" id="submitBtn">Check RTB Status</button>
    </form>

    <div id="responseArea">
        <div id="statusBox" class="status-box">
            <button class="copy-btn" onclick="copyResult()">Copy JSON</button>
            <pre id="jsonOutput"></pre>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('rtbForm');
    const submitBtn = document.getElementById('submitBtn');
    const responseArea = document.getElementById('responseArea');
    const statusBox = document.getElementById('statusBox');
    const jsonOutput = document.getElementById('jsonOutput');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const callerNumber = document.getElementById('caller_number').value.replace(/\s+/g, '');
        const pubId = 'ADO0048';
        const apiKey = '6ab9f76e-24d2-4497-81c3-32e19d13724b';
        
        const apiUrl = `https://rtb.retreaver.com/rtbs.json?key=${apiKey}&publisher_id=${pubId}&caller_number=${encodeURIComponent(callerNumber)}`;

        // UI Reset
        submitBtn.disabled = true;
        submitBtn.innerText = 'Checking Bid...';
        responseArea.style.display = 'none';

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            // Success UI
            statusBox.style.background = '#f0fdf4';
            statusBox.style.border = '1px solid #bbf7d0';
            jsonOutput.style.color = '#166534';
            jsonOutput.textContent = JSON.stringify(data, null, 2);
            responseArea.style.display = 'block';

        } catch (error) {
            // Error UI
            statusBox.style.background = '#fef2f2';
            statusBox.style.border = '1px solid #fecaca';
            jsonOutput.style.color = '#991b1b';
            jsonOutput.textContent = 'Error: Connection failed. This may be a CORS restriction from the browser or an invalid API key.';
            responseArea.style.display = 'block';
            console.error(error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Check RTB Status';
        }
    });

    function copyResult() {
        const text = jsonOutput.textContent;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard');
    }
</script>

</body>
</html>
